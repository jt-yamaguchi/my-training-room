# push / PR ごとに backend と frontend の品質チェックを実行する。
# 本番用Dockerイメージのビルドも通し、デプロイ当日の事故を防ぐ。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: テスト + Checkstyle + ArchUnit
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build

  docker-build:
    # 本番イメージが常にビルド可能であることを保証する
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: backend イメージのビルド
        run: docker build ./backend
      - name: web イメージのビルド
        run: docker build -f web/Dockerfile .
